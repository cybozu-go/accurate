# aqua - Declarative CLI Version Manager
# https://aquaproj.github.io/
checksum:
  enabled: true
  require_checksum: true
  supported_envs:
  - darwin
  - linux
registries:
  - type: standard
    ref: v4.520.0 # renovate: depName=aquaproj/aqua-registry
  - name: local
    type: local
    path: registry.yaml
packages:
  - name: kubernetes/kubectl@v1.36.1
  - name: kubernetes-sigs/controller-runtime/setup-envtest@v0.24.1
  - name: kubernetes-sigs/kubebuilder@v4.14.0
  - name: kubernetes-sigs/kustomize@kustomize/v5.8.1
  - name: kubernetes-sigs/kind@v0.32.0
  - name: rust-lang/mdBook@v0.5.3
  - name: mikefarah/yq@v4.53.2
  - name: clamoriniere/crd-to-markdown@v0.0.3
  - name: kubernetes-sigs/controller-tools/controller-gen@v0.21.0
  - name: helm/helm@v4.2.0
  - name: goreleaser/goreleaser@v2.16.0
  - name: kubernetes/code-generator/applyconfiguration-gen@v0.36.1
    registry: local
  - name: kubernetes/code-generator/conversion-gen@v0.36.1
    registry: local
  - name: golangci/golangci-lint@v2.12.2
  - name: suzuki-shunsuke/pinact@v4.0.0
  - name: oras-project/oras@v1.3.2
  - name: sigstore/cosign@v3.1.1
