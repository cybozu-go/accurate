name: Release
on:
  push:
    tags:
    - 'v*'
jobs:
  image:
    name: Push Container Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Setup
      run: |
        docker buildx create --name=b --driver docker-container
        docker buildx use b
        echo "TAG=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
    - name: Build images
      run: |
        docker buildx build --platform=arm64,amd64 -t ghcr.io/cybozu-go/accurate:$TAG .
    - name: Login to ghcr.io
      run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
    - name: Push images
      run: |
        docker buildx build --platform=arm64,amd64 -t ghcr.io/cybozu-go/accurate:$TAG . --push
  release:
    name: Release on GitHub
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
        cache: true
    - uses: ./.github/actions/aqua
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set previous release tag for GoReleaser
      run: |
        export TAG=$(curl -s "https://api.github.com/repos/cybozu-go/accurate/releases/latest" | jq -r .tag_name)
        echo "GORELEASER_PREVIOUS_TAG=${TAG}" >> $GITHUB_ENV
    - name: GoReleaser
      run: goreleaser release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Update new version in krew-index
      uses: rajatjindal/krew-release-bot@c970b8a8f6dbc2f2285a26e3ae160903b87002c3 # v0.0.51
  chart-release:
    runs-on: ubuntu-24.04
    needs: release
    if: contains(needs.release.result, 'success')
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/aqua
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Login to ghcr.io
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Set chart version
        run: |          
          oras repo tags "ghcr.io/cybozu-go/charts/accurate" --exclude-digest-tags --format json > .oci-tags.json
          
          # get the release tag version
          tag_version=${GITHUB_REF##*/v}

          # get the latest chart version
          chart_version="$(
            jq -r '.tags[]?' .oci-tags.json |
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
          )"
          chart_patch_version=${chart_version##*.}
          new_patch_version=$(($chart_patch_version+1))

          # if minor or major version changed, reset new patch version
          local_version=$(cat charts/accurate/Chart.yaml | yq .version | sed "s/0-chart-patch-version-placeholder/$chart_patch_version/g")
          [ "$local_version" != "$chart_version" ] && new_patch_version=0

          # replace placeholder with new version
          sed --in-place "s/app-version-placeholder/$tag_version/g" charts/accurate/Chart.yaml
          sed --in-place "s/0-chart-patch-version-placeholder/$new_patch_version/g" charts/accurate/Chart.yaml
          sed --in-place "s/app-version-placeholder/$tag_version/g" charts/accurate/values.yaml

      - name: Create chart release notes
        run: |
          tag_version=${GITHUB_REF##*/}
          cat <<EOF > ./charts/accurate/RELEASE.md
          Helm chart for accurate [$tag_version](https://github.com/cybozu-go/accurate/releases/tag/$tag_version)

          EOF

      - name: Publish and sign OCI Helm chart
        run: |
          mkdir -p .dist
          chart_ref="ghcr.io/cybozu-go/charts/accurate"

          helm package charts/accurate --destination .dist

          chart_package="$(find .dist -maxdepth 1 -name 'accurate-*.tgz' -print -quit)"
          test -n "${chart_package}"

          helm push "${chart_package}" oci://ghcr.io/cybozu-go/charts 2>&1 | tee .digest

          digest=$(awk -F "[, ]+" '/Digest/{print $NF}' .digest)
          test -n "$digest"

          cosign sign --yes \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ github.sha }}" \
            -a "kind=helm-chart" \
            "${chart_ref}@${digest}"

      - name: Publish Artifact Hub repository metadata
        run: |
          set -euo pipefail

          chart_ref="ghcr.io/cybozu-go/charts/accurate"

          oras push "${chart_ref}:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
