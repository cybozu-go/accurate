name: CI
on:
  pull_request:
  push:
    branches:
    - 'main'
jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: ./.github/actions/setup-go-with-takumi-guard
    - uses: ./.github/actions/aqua
    - run: make release-build
  test:
    name: Small tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: ./.github/actions/setup-go-with-takumi-guard
    - uses: ./.github/actions/aqua
    - run: make lint
    - run: make test
    - run: make check-generate
    - run: make envtest
  versions:
    runs-on: ubuntu-24.04
    outputs:
      kubernetes: ${{ steps.versions.outputs.kubernetes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: versions
        run: |
          KUBERNETES_VERSION="$(awk -F= '$1 == "KUBERNETES_VERSION" {print $2}' versions.env)"
          KUBERNETES_PREVIOUS_VERSION="$(awk -F= '$1 == "KUBERNETES_PREVIOUS_VERSION" {print $2}' versions.env)"
          KUBERNETES_OLDEST_VERSION="$(awk -F= '$1 == "KUBERNETES_OLDEST_VERSION" {print $2}' versions.env)"

          printf 'kubernetes=["%s","%s","%s"]\n' \
            "$KUBERNETES_VERSION" \
            "$KUBERNETES_PREVIOUS_VERSION" \
            "$KUBERNETES_OLDEST_VERSION" \
            >> "$GITHUB_OUTPUT"
  e2e:
    name: End-to-End Tests
    needs: versions
    strategy:
      matrix:
        k8s-version: ${{ fromJSON(needs.versions.outputs.kubernetes) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: ./.github/actions/setup-go-with-takumi-guard
      with:
        cache: true
    - uses: ./.github/actions/aqua
    - run: make start KUBERNETES_VERSION=${{ matrix.k8s-version }}
      working-directory: e2e
    - run: make test
      working-directory: e2e
    - run: make logs
      working-directory: e2e
      if: always()
    - name: Sanitize version name
      id: sanitize
      run: |
        # extract only version name because ':' is not allowed for artifact name
        SANITIZED_K8S_VERSION="$(echo ${{ matrix.k8s-version}} | awk -F '@' '{print $1}')"
        echo "SANITIZED_K8S_VERSION=$SANITIZED_K8S_VERSION" >> $GITHUB_OUTPUT
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: logs-${{ steps.sanitize.outputs.SANITIZED_K8S_VERSION }}.tar.gz
        path: e2e/logs.tar.gz
