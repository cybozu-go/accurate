name: Dockerfile Pin
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.github/workflows/dockerfile-pin.yaml'
      - '.github/actions/aqua/action.yaml'
      - 'aqua.yaml'
      - 'aqua-checksums.json'
      - 'aqua-policy.yaml'
jobs:
  verify-dockerfile-pin:
    name: Verify Dockerfile image tags and digests
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/aqua
      - name: Verify tags resolve to the pinned digests
        run: dockerfile-pin check --verify-tag -f Dockerfile
