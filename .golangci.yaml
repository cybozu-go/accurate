version: "2"
run:
  build-tags:
    - envtest
linters:
  default: standard
  enable:
    - contextcheck
    - errorlint
    - gosec
    - misspell
    - modernize
    - nilnil
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush
